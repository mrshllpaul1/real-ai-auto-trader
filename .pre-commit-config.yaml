# Pre-commit hooks for secret protection and code quality
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Prevent committing secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.env\.example|
            SECURITY\.md|
            .*test.*\.json|
            package-lock\.json
          )$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent committing large files
      - id: check-added-large-files
        args: ['--maxkb=1000']
      
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
      
      # Check JSON files
      - id: check-json
      
      # Check YAML files
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      
      # Prevent committing to main/master directly
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']
      
      # Check for merge conflicts
      - id: check-merge-conflict
      
      # Fix end of files
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            .*\.pack|
            .*\.png|
            .*\.jpg|
            .*\.jpeg
          )$
      
      # Trim trailing whitespace
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            .*\.md|
            .*\.pack
          )$
      
      # Detect private keys
      - id: detect-private-key

  # Python code formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        files: ^backend/.*\.py$

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black']
        files: ^backend/.*\.py$

  # JavaScript/TypeScript formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|css|md)$
        exclude: |
          (?x)^(
            package-lock\.json|
            .*\.min\.js|
            .*\.pack
          )$

# Configuration for detect-secrets
# To create baseline: detect-secrets scan > .secrets.baseline
# To audit: detect-secrets audit .secrets.baseline
