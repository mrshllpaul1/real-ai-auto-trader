version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: tethys-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backups:/docker-entrypoint-initdb.d/backups
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tethys-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=tethys_trading
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - ./ml_models:/app/ml_models
      - ./backups:/app/backups
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tethys-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
